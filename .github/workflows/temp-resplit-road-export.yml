name: Temporary offline road artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct compact road dataset
        shell: bash
        run: |
          mkdir -p transfer-artifact
          cat generated/offline-roads-transfer-small/chunk_*.txt | base64 --decode > transfer-artifact/offline-roads.json.xz
          cp generated/offline-roads-transfer-small/manifest.json transfer-artifact/manifest.json
          sha256sum transfer-artifact/offline-roads.json.xz
      - name: Upload compact road dataset
        uses: actions/upload-artifact@v4
        with:
          name: offline-roads-transfer
          path: transfer-artifact/
          if-no-files-found: error
          retention-days: 1
