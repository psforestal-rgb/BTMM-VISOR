name: Temporary compact road transfer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-resplit-road-export.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/offline-road-export-20260728
          fetch-depth: 0
      - name: Compact existing road extract for transfer
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import lzma
          from pathlib import Path

          source = Path('generated/offline-roads')
          encoded = ''.join(path.read_text(encoding='ascii') for path in sorted(source.glob('chunk_*.txt')))
          payload = json.loads(gzip.decompress(base64.b64decode(encoded)))
          minimal = {
              'r': [item['g'] for item in payload['roads']],
              'i': [item['g'] for item in payload['route2']],
          }
          raw = json.dumps(minimal, separators=(',', ':')).encode('utf-8')
          compressed = lzma.compress(raw, format=lzma.FORMAT_XZ, preset=9 | lzma.PRESET_EXTREME)
          transfer = base64.b64encode(compressed).decode('ascii')

          output = Path('generated/offline-roads-transfer-small')
          output.mkdir(parents=True, exist_ok=True)
          for old in output.glob('chunk_*.txt'):
              old.unlink()
          chunk_size = 3000
          chunks = [transfer[i:i + chunk_size] for i in range(0, len(transfer), chunk_size)]
          for index, chunk in enumerate(chunks):
              (output / f'chunk_{index:03d}.txt').write_text(chunk, encoding='ascii')
          manifest = {
              'chunks': len(chunks),
              'chunk_size': chunk_size,
              'road_lines': len(minimal['r']),
              'route2_lines': len(minimal['i']),
              'raw_bytes': len(raw),
              'xz_bytes': len(compressed),
              'base64_chars': len(transfer),
              'sha256_raw': hashlib.sha256(raw).hexdigest(),
              'sha256_xz': hashlib.sha256(compressed).hexdigest(),
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit transfer chunks to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/offline-roads-transfer-small
          git commit -m "Create small transfer chunks for offline roads" || exit 0
          git push origin HEAD:assistant/offline-road-export-20260728
