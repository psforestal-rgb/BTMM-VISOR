name: Temporary offline road export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-offline-road-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/offline-road-export-20260728
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests shapely pyproj
      - name: Build extract
        run: python .github/scripts/build_offline_roads.py
      - name: Commit extract to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/offline-roads
          git commit -m "Build clipped offline road extract" || exit 0
          git push origin HEAD:assistant/offline-road-export-20260728
